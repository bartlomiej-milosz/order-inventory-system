services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the release image}
    environment:
      SPRING_PROFILES_ACTIVE: deploy
      DB_HOST: ${DB_HOST:?Set the PostgreSQL TLS hostname}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set the PostgreSQL database name}
      DB_USER: ${DB_USER:?Set the application role}
      FLYWAY_USER: ${FLYWAY_USER:?Set the migration role}
      DB_CA_CERT_FILE: /app/db-ca.pem
    secrets:
      - DB_PASSWORD
      - FLYWAY_PASSWORD
    volumes:
      - type: bind
        source: ${DB_CA_CERT_SOURCE:?Set the PostgreSQL CA certificate path}
        target: /app/db-ca.pem
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--max-time",
          "2",
          "http://127.0.0.1:8080/readyz",
        ]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    restart: unless-stopped
    stop_grace_period: 35s

secrets:
  DB_PASSWORD:
    file: ${DB_PASSWORD_FILE:?Set the application password file path}
  FLYWAY_PASSWORD:
    file: ${FLYWAY_PASSWORD_FILE:?Set the Flyway password file path}
