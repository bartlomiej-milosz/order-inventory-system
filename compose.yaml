services:
  db:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_DB: order_inventory
      POSTGRES_USER: inventory_local
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "inventory_local",
          "-d",
          "order_inventory",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    profiles: [app]
    image: order-inventory-system:local
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      DB_HOST: db
      DB_PORT: "5432"
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--max-time",
          "2",
          "http://127.0.0.1:8080/readyz",
        ]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12
    stop_grace_period: 35s

volumes:
  postgres-data:
